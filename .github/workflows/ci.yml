name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        working-directory: services/api
        run: pip install -e ".[dev]"
      - name: Check generated TypeScript contract types are current
        working-directory: services/api
        run: python scripts/generate_ts_types.py --check
      - name: Test (memory + SQLite stores)
        working-directory: services/api
        run: python -m pytest tests/ -v
      - name: Smoke tests and agent evals (live API, fresh SQLite)
        working-directory: services/api
        run: python evals/run.py --json evals-report.json
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: services/api/evals-report.json
          if-no-files-found: ignore

  api-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helixos
          POSTGRES_PASSWORD: helixos
          POSTGRES_DB: helixos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helixos -d helixos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable database: the tests drop and recreate the public schema.
      HELIX_TEST_POSTGRES_URL: postgresql+psycopg://helixos:helixos@localhost:5432/helixos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        working-directory: services/api
        run: pip install -e ".[dev]"
      - name: Test (memory + SQLite + PostgreSQL, concurrency suite)
        working-directory: services/api
        run: python -m pytest tests/ -v

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f services/api/Dockerfile -t helixos-api .
      - name: Boots in staging posture; live and ready
        run: |
          docker run -d --name api -p 8000:8000 \
            -e HELIX_ENV=staging \
            -e HELIX_DATABASE_URL=sqlite:////tmp/helix.db \
            -e ALLOWED_ORIGINS=https://app.example.com \
            helixos-api
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/ready && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health || { docker logs api; exit 1; }
          curl -sf http://127.0.0.1:8000/ready || { docker logs api; exit 1; }
      - name: Production refuses to start without safe config
        run: |
          if docker run --rm helixos-api python -c "import helixos.main"; then
            echo "production started with no configuration"
            exit 1
          fi
      - name: Operator CLI runs from the image
        run: |
          docker run --rm -e HELIX_DATABASE_URL=sqlite:////tmp/cli.db helixos-api \
            python -m helixos.auth.admin create-org --id org_ci --name "CI" --admin-email ci@example.com

  web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f apps/web/Dockerfile -t helixos-web --build-arg HELIX_API_PROXY_TARGET=http://api:8000 .
      - name: Serves the app and has no demo token baked in
        run: |
          docker run -d --name web -p 8080:8080 helixos-web
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ -o /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/ -o /dev/null || { docker logs web; exit 1; }
          if docker exec web sh -c 'grep -rl org-demo-token /app/apps/web/.next'; then
            echo "demo token found in the production bundle"
            exit 1
          fi

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format, init (no backend) and validate
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test biopython connector
        working-directory: mcp/servers/biopython_local
        run: python -m unittest test_server -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Typecheck, lint, test, build
        working-directory: apps/web
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: apps/desktop
        run: npm ci
      - name: Typecheck and build
        working-directory: apps/desktop
        run: |
          npm run typecheck
          npm test
          npm run build
