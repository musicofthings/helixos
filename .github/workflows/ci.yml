name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        working-directory: services/api
        run: pip install -e ".[dev]"
      - name: Check generated TypeScript contract types are current
        working-directory: services/api
        run: python scripts/generate_ts_types.py --check
      - name: Test (memory + SQLite stores)
        working-directory: services/api
        run: python -m pytest tests/ -v
      - name: Smoke tests and agent evals (live API, fresh SQLite)
        working-directory: services/api
        run: python evals/run.py --json evals-report.json
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: services/api/evals-report.json
          if-no-files-found: ignore

  api-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helixos
          POSTGRES_PASSWORD: helixos
          POSTGRES_DB: helixos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helixos -d helixos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable database: the tests drop and recreate the public schema.
      HELIX_TEST_POSTGRES_URL: postgresql+psycopg://helixos:helixos@localhost:5432/helixos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        working-directory: services/api
        run: pip install -e ".[dev]"
      - name: Test (memory + SQLite + PostgreSQL, concurrency suite)
        working-directory: services/api
        run: python -m pytest tests/ -v

  connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test biopython connector
        working-directory: mcp/servers/biopython_local
        run: python -m unittest test_server -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Typecheck, lint, test, build
        working-directory: apps/web
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: apps/desktop
        run: npm ci
      - name: Typecheck and build
        working-directory: apps/desktop
        run: |
          npm run typecheck
          npm test
          npm run build
