<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">HelixOS platform poster</title>
  <desc id="desc">A conceptual HelixOS stage showing workspaces, molecular flow, and audit trail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1411" />
      <stop offset="60%" stop-color="#12241e" />
      <stop offset="100%" stop-color="#0e1a17" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16302a" />
      <stop offset="100%" stop-color="#101f1a" />
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)" />
  <circle cx="200" cy="120" r="260" fill="#6fd9a2" opacity="0.18" />
  <circle cx="1180" cy="200" r="230" fill="#e2b15a" opacity="0.12" />
  <rect x="120" y="170" width="1160" height="560" rx="24" fill="url(#card)" stroke="#31574b" />
  <rect x="160" y="210" width="260" height="480" rx="14" fill="#0f1e19" stroke="#2e5548" />
  <text x="190" y="255" fill="#b7cfc4" font-size="26" font-family="Manrope, sans-serif">Workspaces</text>
  <text x="190" y="300" fill="#6fd9a2" font-size="24" font-family="Manrope, sans-serif"># molecular-biology</text>
  <text x="190" y="338" fill="#9cb9ad" font-size="22" font-family="Manrope, sans-serif"># biochemistry</text>
  <text x="190" y="376" fill="#9cb9ad" font-size="22" font-family="Manrope, sans-serif"># microbiology</text>
  <rect x="470" y="220" width="760" height="70" rx="10" fill="#122a23" stroke="#2e5548" />
  <text x="510" y="265" fill="#b7cfc4" font-size="25" font-family="Manrope, sans-serif">Gibson assembly sprint</text>
  <rect x="1060" y="238" width="140" height="36" rx="18" fill="#193f32" />
  <text x="1090" y="263" fill="#6fd9a2" font-size="18" font-family="Manrope, sans-serif">ready</text>
  <rect x="470" y="320" width="760" height="100" rx="12" fill="#0f211b" stroke="#2e5548" />
  <rect x="470" y="440" width="760" height="100" rx="12" fill="#0f211b" stroke="#2e5548" />
  <rect x="470" y="560" width="760" height="100" rx="12" fill="#0f211b" stroke="#2e5548" />
  <text x="510" y="382" fill="#d9e9e1" font-size="24" font-family="Manrope, sans-serif">Experiment versions and sample plate state</text>
  <text x="510" y="502" fill="#d9e9e1" font-size="24" font-family="Manrope, sans-serif">Molecular sequence analysis and connector jobs</text>
  <text x="510" y="622" fill="#d9e9e1" font-size="24" font-family="Manrope, sans-serif">Hash-chained audit events for regulated actions</text>
  <text x="120" y="810" fill="#b7cfc4" font-size="30" font-family="Fraunces, serif">HelixOS Investor Preview</text>
</svg>
